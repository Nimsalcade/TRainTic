  ${S.cards.map((c,i)=>`<div class="card row"><span class="ib" style="padding:0;border:0">${ic('card',22)}</span><span class="grow"><b>${esc(c.brand)} •••• ${c.last}</b><br><small class="muted">Expires ${c.exp}</small></span><button class="ibtn" style="color:var(--bad)" onclick="S.cards.splice(${i},1);rerender();toast('Card removed')" aria-label="Remove card">${ic('trash',20)}</button></div>`).join('')}</div>
  <div class="foot"><button class="btn" onclick="go('addCard')">Add New Payment</button></div></div>`;
SCR.addCard=()=>`<div class="scr">${hd('Add New Payment')}<form class="body" style="gap:22px" onsubmit="event.preventDefault();saveCard()">
  <div class="wallet-card" style="min-height:180px;display:flex;flex-direction:column;justify-content:space-between"><b style="position:relative;z-index:1">${esc(S.user.name)}</b><span class="num" style="letter-spacing:.2em;font-size:18px;position:relative;z-index:1">•••• •••• •••• ••••</span></div>
  ${field('cn','Card Number','text','','card','1234 5678 9012 3456')}<div class="two">${field('ce','Expiry Date','text','','cal','MM/YY')}${field('cv','CVV','password','','shield','123')}</div>
  <button class="btn" style="margin-top:auto">Add Card</button></form></div>`;
function saveCard(){const n=document.getElementById('cn').value.replace(/\D/g,''),e=document.getElementById('ce').value.trim();if(n.length<13||n.length>19)return toast('Card numbers have 13 to 19 digits');if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(e))return toast('Write the expiry as MM/YY, for example 09/28');if(!/^\d{3,4}$/.test(document.getElementById('cv').value))return toast('CVV is the 3 or 4 digits on the back');S.cards.push({brand:n[0]==='4'?'Visa':n[0]==='5'?'Mastercard':n[0]==='3'?'Amex':'Card',last:n.slice(-4),exp:e});back();toast('Card added')}
SCR.notifSettings=()=>`<div class="scr">${hd('Notification')}<div class="body"><div class="card" style="padding:4px 16px">${[['trip','Trip updates','Delays, platform changes, boarding'],['promo','Special offers','Discount codes and fare sales'],['news','News & stories','Station and network news']].map(([k,l,d])=>`<button class="li" onclick="S.notif.${k}=!S.notif.${k};rerender()"><span class="grow"><b>${l}</b><small class="muted">${d}</small></span><span class="switch ${S.notif[k]?'on':''}" role="switch" aria-checked="${S.notif[k]}"></span></button>`).join('')}</div></div></div>`;
SCR.help=()=>`<div class="scr">${hd('Help Center')}<div class="body">${[['How do I change my seat?','Re-schedule the trip to the same train, or cancel and rebook. Seats are kept when you re-schedule.'],['When do I get my refund?','Right away, into My Wallet. More than 24h before departure you get 75%, 2–24h gets 50%, under 2h no refund.'],['Can I book for someone else?','Yes. Add them under Account → Passengers List, then choose them on the Booking Details screen.'],['Where is my e-ticket?','My Ticket → Active → tap the trip → Show E-Ticket. Each passenger has their own QR code.']].map(([q,a])=>`<details class="card"><summary style="font-weight:700;cursor:pointer;list-style:none" class="between">${q}${ic('down',20)}</summary><p class="muted" style="margin:12px 0 0;line-height:1.6">${a}</p></details>`).join('')}</div></div>`;

/* notifications */
const NOTES=[
 {t:'Payment successful',d:'Your booking for Proxima → Aurora Point is confirmed.',ico:'check',when:'Today'},
 {t:'25% off this week',d:'Use code 8XKSD on any booking. Up to $20 off.',ico:'gift',when:'Yesterday'},
 {t:'Platform change',d:'Northline trains from Neo Delta now leave from platform 3.',ico:'info',when:'2 days ago'},
 {t:'Wallet topped up',d:'$125.00 added to My Wallet.',ico:'wallet',when:'8 days ago'},
];
SCR.notifications=()=>{const u=S.unread;S.unread=0;return `<div class="scr">${hd('Notification')}<div class="body">${NOTES.map((n,i)=>`<div class="card row" style="align-items:flex-start"><span class="ib" style="padding:0;border:0">${ic(n.ico,22)}</span><div class="grow"><div class="between"><b>${n.t}</b>${i<u?'<span class="tag">New</span>':''}</div><small class="muted" style="display:block;margin:4px 0;line-height:1.5">${n.d}</small><small class="muted xs">${n.when}</small></div></div>`).join('')}</div></div>`};

/* news & promos */
SCR.newsList=()=>`<div class="scr">${hd('Our News & Stories')}<div class="body">${NEWS.map((n,i)=>`<button class="promo" onclick="go('news',{i:${i}})">${newsArt(n,i,150)}<div class="bot"><div class="grow"><b style="display:block;font-size:16px">${n.t}</b><small class="muted">${n.ago}</small></div></div></button>`).join('')}</div></div>`;
SCR.news=({i})=>{const n=NEWS[i];return `<div class="scr">${hd('',{right:`<button class="ibtn" onclick="copyTxt('${n.t.replace(/'/g,'')}')" aria-label="Copy headline">${ic('share',22)}</button>`})}<div class="body"><div style="border-radius:20px;overflow:hidden">${newsArt(n,i,220)}</div><h2 style="font-size:25px;line-height:1.25">${n.t}</h2><small class="muted">${n.ago}</small>${n.b.map(p=>`<p style="margin:0;line-height:1.7;max-width:65ch">${p}</p>`).join('')}</div></div>`};
SCR.promo=({i})=>{const p=PROMOS[i];return `<div class="scr">${hd('Special Offers')}<div class="body"><div class="promo">${promoArt(p,i)}</div><h2 style="font-size:24px">${p.t}</h2><small class="muted">${p.s}</small>
  <div class="card between" style="border:2px dashed var(--brand);box-shadow:none"><span><small class="muted">Coupon code</small><br><b style="font-size:22px;letter-spacing:.08em" class="num">${p.code}</b></span><button class="btn sm" style="width:auto;padding:0 18px" onclick="copyTxt('${p.code}')">${ic('copy',18)} Copy</button></div>
  <h3>Terms</h3><ul style="margin:0;padding-left:20px;line-height:1.8" class="muted">${p.terms.map(t=>`<li>${t}</li>`).join('')}</ul><small class="muted">Enter the code on the Review Summary screen before you confirm.</small></div>
  <div class="foot"><button class="btn" onclick="reset('home')">Book a Trip</button></div></div>`};

/* check booking */
SCR.checkBooking=({err})=>`<div class="scr">${hd('Check Booking')}<form class="body" style="gap:22px" onsubmit="event.preventDefault();findBooking()">
  <p class="muted" style="margin:0;line-height:1.55">Enter the 7-character booking ID from your confirmation email.</p>
  <div class="fld"><label for="cb">Booking ID</label><div class="inp">${ic('ticket',20)}<input id="cb" placeholder="e.g. VX79WRK" style="text-transform:uppercase" maxlength="7"></div></div>
  ${err?`<small style="color:var(--bad);font-weight:600">${err}</small>`:''}
  <div class="stack" style="gap:8px"><small class="muted">Your recent bookings</small><div class="pills" style="flex-wrap:wrap">${S.tickets.slice(0,4).map(t=>`<button type="button" class="pill" onclick="document.getElementById('cb').value='${t.id}'">${t.id}</button>`).join('')}</div></div>
  <button class="btn" style="margin-top:auto">Check Booking</button></form></div>`;
function findBooking(){const v=document.getElementById('cb').value.trim().toUpperCase();const t=S.tickets.find(x=>x.id===v);if(t)go('ticketDetail',{id:v});else{stack.at(-1).p.err=v?`No booking with ID ${v}. Check the code in your email; it has letters and digits only.`:'Type your booking ID first.';rerender()}}

/* tools */
const TF={from:'Apex Square',to:'Neo Delta',date:TODAY,cls:0,pax:1,weight:5,station:'Proxima',mins:10,tid:null};
const tfStations=()=>`<div class="row" style="align-items:stretch"><div class="grow stack" style="gap:14px">${['from','to'].map(k=>`<div class="fld"><label>${k==='from'?'Origin':'Destination'}</label><button class="inp" onclick="pickStation('${k}',1)">${ic('train',20)}<span class="val">${TF[k]}</span>${ic('down',18)}</button></div>`).join('')}</div><button class="swap" onclick="[TF.from,TF.to]=[TF.to,TF.from];rerender()" aria-label="Swap">${ic('swap',20,2)}</button></div>`;
const tfDate=()=>`<div class="fld"><label for="tfd">Date</label><label class="inp">${ic('cal',20)}<input id="tfd" type="date" min="${TODAY}" value="${TF.date}" onchange="TF.date=this.value;rerender()"></label></div>`;
const TOOLS={
 seats:{t:'Seat Availability',f:()=>tfStations()+tfDate(),r:()=>genTrains(TF.from,TF.to,TF.date,0).map(t=>{const r=rng(hsh(t.no+t.date));return `<div class="card stack" style="gap:10px"><div class="row">${opLogo(t.op)}<div class="grow"><b>${OPS[t.op].n}</b><br><small class="muted">${t.no} · ${ftime(t.dep)} → ${ftime(t.arr)}</small></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${CLASSES.map((c,i)=>{const n=i?Math.floor(r()*24):t.seats;return `<div style="background:${n?'var(--brand-softer)':'var(--bad-soft)'};border-radius:12px;padding:8px;text-align:center"><small class="muted xs">${c.n}</small><br><b class="num" style="color:${n?'var(--brand)':'var(--bad)'}">${n?n+' left':'Full'}</b></div>`}).join('')}</div></div>`}).join('')},
 schedule:{t:'Train Schedule',f:()=>tfStations()+tfDate(),r:()=>genTrains(TF.from,TF.to,TF.date,0).map(t=>tripCard(t,{click:`go('routeView',{ri:${R(t)}})`,right:departed(t)?'<small class="muted">Departed</small>':'<span class="tag soft">Route</span>'})).join('')},
 route:{t:'Route Information',f:()=>tfStations(),r:()=>{const t=genTrains(TF.from,TF.to,TF.date,0)[2];return routeTimeline(t,false)}},
 live:{t:'Train Live Status',f:()=>tfStations(),r:()=>{const list=genTrains(TF.from,TF.to,TODAY,0);return `<small class="muted">Today's trains · tap one to follow it</small>`+list.map(t=>{const now=new Date(),dep=dtOf(t.date,t.dep),arr=dtOf(arrDate(t),t.arr%1440),st=now<dep?['Scheduled','soft']:now>arr?['Arrived','ok']:['Running','warn'];return tripCard(t,{click:`go('routeView',{ri:${R(t)},live:1})`,right:`<span class="tag ${st[1]}">${st[0]}</span>`})}).join('')}},
 fare:{t:'Train Fare',f:()=>tfStations()+`<div class="two"><div class="fld"><label>Class</label><button class="inp" onclick="pickClass(1)">${ic('class',20)}<span class="val">${CLASSES[TF.cls].n}</span>${ic('down',18)}</button></div><div class="fld"><label>Passengers</label><button class="inp" onclick="pickPax(1)">${ic('user',20)}<span class="val">${TF.pax} Adult${TF.pax>1?'s':''}</span>${ic('down',18)}</button></div></div>`,r:()=>{const l=genTrains(TF.from,TF.to,addD(TODAY,1),TF.cls),lo=Math.min(...l.map(t=>t.price)),hi=Math.max(...l.map(t=>t.price)),fee=2*TF.pax;return `<div class="card stack"><div class="kv"><span>Lowest fare per person</span><span class="num">${money(lo)}</span></div><div class="kv"><span>Highest fare per person</span><span class="num">${money(hi)}</span></div><div class="kv"><span>Service fee</span><span class="num">${money(fee)}</span></div><div class="hr"></div><div class="kv"><span style="color:var(--ink);font-weight:700">Estimated total</span><span class="price num">${money(lo*TF.pax+fee)} – ${money(hi*TF.pax+fee)}</span></div><small class="muted">Based on tomorrow's ${l.length} departures. Distance ${Math.abs(STATIONS.indexOf(TF.from)-STATIONS.indexOf(TF.to))*38} km.</small></div><button class="btn" onclick="Object.assign(H,{trip:'one',from:TF.from,to:TF.to,cls:TF.cls,pax:TF.pax,date:addD(TODAY,1)});startSearch()">Search these trains</button>`}},
 refund:{t:'Refund Calculation',f:()=>{const act=S.tickets.filter(t=>t.status==='active');if(!TF.tid||!act.find(t=>t.id===TF.tid))TF.tid=act[0]?.id;return act.length?`<div class="fld"><label>Trip</label><label class="inp">${ic('ticket',20)}<select onchange="TF.tid=this.value;rerender()">${act.map(t=>`<option value="${t.id}" ${t.id===TF.tid?'selected':''}>${t.id} · ${t.legs[0].t.from} → ${t.legs[0].t.to}, ${fdate(t.legs[0].t.date)}</option>`).join('')}</select></label></div>`:emptyState('ticket','No active trips','Only upcoming trips can be refunded.')},
   r:()=>{const tk=S.tickets.find(t=>t.id===TF.tid);if(!tk)return '';const r=refundFor(tk);return `<div class="card stack"><div class="kv"><span>Ticket paid</span><span class="num">${money(tk.total)}</span></div><div class="kv"><span>Time to departure</span><span>${r.h>48?Math.floor(r.h/24)+' days':Math.max(0,Math.floor(r.h))+' hours'}</span></div><div class="kv"><span>Refund rate</span><span>${r.pct}%</span></div><div class="hr"></div><div class="kv"><span style="color:var(--ink);font-weight:700">You'd get back</span><span class="price num">${money(r.amt)}</span></div></div><div class="card stack" style="box-shadow:none;background:var(--bg)"><b>Policy</b><small class="muted" style="line-height:1.7">More than 24h before departure: 75%<br>2 to 24h before: 50%<br>Under 2h: no refund</small></div><button class="btn soft" style="color:var(--bad)" onclick="cancelSheet('${tk.id}')">Cancel this trip</button>`}},
 alarm:{t:'Station Alarm',f:()=>`<div class="fld"><label>Wake me before</label><button class="inp" onclick="pickStation('station',1)">${ic('pin',20)}<span class="val">${TF.station}</span>${ic('down',18)}</button></div><div class="fld"><label>Alert</label><div class="pills">${[5,10,15,30].map(m=>`<button class="pill ${TF.mins===m?'on':''}" onclick="TF.mins=${m};rerender()">${m} min before</button>`).join('')}</div></div><button class="btn" onclick="setAlarm()">Set Alarm</button>`,
   r:()=>S.alarms.length?`<h3>Your alarms</h3>`+S.alarms.map((a,i)=>`<div class="card row"><span class="ib" style="padding:0;border:0">${ic('alarm',22)}</span><span class="grow"><b>${a.st}</b><br><small class="muted">${a.m} minutes before arrival</small></span><button class="ibtn" style="color:var(--bad)" onclick="S.alarms.splice(${i},1);rerender()" aria-label="Delete alarm">${ic('trash',20)}</button></div>`).join(''):''},
 ship:{t:'Shipping Rates',f:()=>tfStations()+`<div class="fld"><label for="sw">Parcel weight (kg)</label><label class="inp">${ic('box',20)}<input id="sw" type="number" min="0.5" max="50" step="0.5" value="${TF.weight}" onchange="TF.weight=Math.min(50,Math.max(.5,+this.value||.5));rerender()"></label></div>`,
   r:()=>{const d=Math.abs(STATIONS.indexOf(TF.from)-STATIONS.indexOf(TF.to))*38,base=5,dist=+(d*.04).toFixed(2),w=+(TF.weight*.8).toFixed(2);return `<div class="card stack"><div class="kv"><span>Base rate</span><span class="num">${money(base)}</span></div><div class="kv"><span>Distance (${d} km)</span><span class="num">${money(dist)}</span></div><div class="kv"><span>Weight (${TF.weight} kg × $0.80)</span><span class="num">${money(w)}</span></div><div class="hr"></div><div class="kv"><span style="color:var(--ink);font-weight:700">Shipping cost</span><span class="price num">${money(base+dist+w)}</span></div><small class="muted">Drop off at the parcel desk at ${TF.from}. Arrives on the next train with space, usually same day. Max 50 kg.</small></div>`}},
};
SCR.tool=({k})=>{const T=TOOLS[k];return `<div class="scr">${hd(T.t)}<div class="body"><div class="card stack" style="gap:16px">${T.f()}</div>${T.r()}</div></div>`};
function routeTimeline(t,live){
  const st=stops(t), now=new Date(), nm=(now-parseD(t.date))/6e4, delay=live?[0,0,0,3,5][hsh(t.no)%5]:0;
  let cur=-1;if(live)st.forEach((s,i)=>{if(nm>=s.m+delay)cur=i});
  const msg=!live?`${st.length} stops · ${st.at(-1).km} km · ${fdur(t.dur)}`:nm<t.dep?`Not departed yet · leaves ${t.from} at ${ftime(t.dep)}`:cur>=st.length-1?`Arrived at ${t.to}`:`Between ${st[cur].n} and ${st[cur+1].n} · ${delay?delay+' min late':'on time'}`;
  return `<div class="card stack"><div class="row">${opLogo(t.op)}<div class="grow"><b>${OPS[t.op].n} · ${t.no}</b><br><small class="muted">${msg}</small></div>${live?`<span class="tag ${delay?'warn':'ok'}">${delay?'+'+delay+' min':'On time'}</span>`:''}</div><div class="hr"></div>
  <div class="tl">${st.map((s,i)=>`<div class="stp ${i<=cur?'done':''} ${i===cur&&i<st.length-1?'cur':''}"><span class="tm num">${ftime(s.m+delay*(i>0))}</span><span class="rail"><span class="node"></span></span><span><b>${s.n}</b><br><small class="muted">${s.code} · ${s.km} km${i===0?' · departs':i===st.length-1?' · terminus':' · 2 min stop'}</small></span></div>`).join('')}</div></div>`;
}
SCR.routeView=({ri,live})=>{const t=REG[ri];return `<div class="scr">${hd(live?'Live Status':'Train Route',{sub:`${t.from} → ${t.to}`})}<div class="body">${routeTimeline(t,live)}${live?`<button class="btn soft" onclick="rerender()">Refresh</button>`:''}</div></div>`};

function setAlarm(){S.alarms.push({st:TF.station,m:TF.mins});rerender();modal({icon:'alarm',title:'Station Alarm Set!',text:`We'll alert you ${TF.mins} minutes before ${TF.station}.`,actions:`<button class="btn" onclick="closeOverlay()">OK</button>`})}
/* boot */
if(S.signed)reset('home');else reset('splash');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!S.theme)rerender()});
</script>

</body></html>
